<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Espace Utilisateur</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h2>Espace Utilisateur (rôle USER)</h2>
        <p>Connecté en tant que : <b th:text="${#authentication.name}">user</b></p>
        <p><a th:href="@{/home}">Accueil</a></p>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Se déconnecter</button>
        </form>
    </div>
</body>
</html>
